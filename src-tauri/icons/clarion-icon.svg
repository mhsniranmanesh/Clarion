<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7cf7"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00d2a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="4" y="4" width="1016" height="1016" rx="218" fill="none" stroke="#2a2a45" stroke-width="4"/>
  <!-- Sound wave bars -->
  <g transform="translate(512, 512)">
    <!-- Bar 1 (leftmost) -->
    <rect x="-200" y="-80" width="48" height="160" rx="24" fill="url(#glow)" opacity="0.7"/>
    <!-- Bar 2 -->
    <rect x="-104" y="-160" width="48" height="320" rx="24" fill="url(#glow)" opacity="0.85"/>
    <!-- Bar 3 (center, tallest) -->
    <rect x="-24" y="-220" width="48" height="440" rx="24" fill="url(#glow)"/>
    <!-- Bar 4 -->
    <rect x="56" y="-140" width="48" height="280" rx="24" fill="url(#glow)" opacity="0.85"/>
    <!-- Bar 5 (rightmost) -->
    <rect x="152" y="-100" width="48" height="200" rx="24" fill="url(#glow)" opacity="0.7"/>
  </g>
  <!-- Small "C" letter accent bottom right -->
</svg>
