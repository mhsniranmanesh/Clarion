name: Feature request
description: Suggest something Clarion should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like to happen

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
